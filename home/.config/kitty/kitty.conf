# The look (font, cursor, padding, borders, tab bar, blur) is the theme's own, from theme-picker's include
# at the end; only behaviour lives here.

# Text
force_ltr               yes

# Mouse
copy_on_select          yes
mouse_hide_wait         15
focus_follows_mouse     yes

# Scrollback
scrollback_lines        20000

# Windows
remember_window_size    yes
enabled_layouts         tall:bias=50;full_size=1;mirrored=false;
hide_window_decorations yes

# Integration
shell_integration       enabled
allow_remote_control    yes
listen_on               unix:/tmp/kitty
editor                  nvim
term                    xterm-kitty
close_on_child_death    yes

# Drawing
sync_to_monitor         yes

# URL Handling
open_url_with           default
url_prefixes            http https file ftp
mouse_map               super+left release grabbed,ungrabbed mouse_handle_click link
allow_hyperlinks        yes

# Selection
select_by_word_characters @-./_~?&=%+#

# Clipboard
clipboard_control       write-clipboard write-primary read-clipboard

# Pager
scrollback_pager        nvim --noplugin -u NONE -c 'runtime plugin/man.vim|Man!' -c "autocmd VimEnter * normal G" -c "nnoremap Q :qa!<CR>"

# Theme: colours and the theme's own look (generated by theme-picker)
include ~/.local/state/theme-picker/current/kitty.conf
